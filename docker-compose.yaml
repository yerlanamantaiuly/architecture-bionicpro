services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "BionicPRO Representation"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_READONLY_USER: "false"
      LDAP_TLS: "false"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./ldap/config.ldif:/ldifs/config.ldif:ro
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=example,dc=com", "-D", "cn=admin,dc=example,dc=com", "-w", "admin"]
      interval: 10s
      timeout: 5s
      retries: 10

  ldap-init:
    image: osixia/openldap:1.5.0
    depends_on:
      ldap:
        condition: service_healthy
    volumes:
      - ./ldap/config.ldif:/ldifs/config.ldif:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "Loading BionicPRO LDIF into OpenLDAP..."
        ldapadd -x -H ldap://ldap -D "cn=admin,dc=example,dc=com" -w admin -f /ldifs/config.ldif || true
        echo "LDAP init done"
        ldapsearch -x -H ldap://ldap -b "ou=People,dc=example,dc=com" -D "cn=admin,dc=example,dc=com" -w admin "(uid=*)" uid
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: http://${PUBLIC_HOST:-10.2.67.21}:8080
      KC_HOSTNAME_ADMIN_URL: http://${PUBLIC_HOST:-10.2.67.21}:8080
      KC_PROXY: edge
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - ldap

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://${PUBLIC_HOST:-10.2.67.21}:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret
      REDIRECT_URI: http://${PUBLIC_HOST:-10.2.67.21}:8001/auth/callback
      FRONTEND_URL: http://${PUBLIC_HOST:-10.2.67.21}:3000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      SESSION_TTL_SECONDS: "1800"
      TOKEN_ENCRYPTION_KEY: "iw3lx6S7H4IMZsm_xrqEJqa5kHozlwoP9J0WFWHHRoU="
      PROFILE_DB_PATH: /data/profiles.db
      YANDEX_IDP_ALIAS: yandex
      YANDEX_CLIENT_ID: 5e79e67eaecc4daaa87a3b5a5e09c05e
      YANDEX_CLIENT_SECRET: b64e2bf97bdb4bbfa08f474595de7d40
    volumes:
      - ./bionicpro-auth/data:/data
    depends_on:
      - keycloak

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://${PUBLIC_HOST:-10.2.67.21}:8000
        REACT_APP_AUTH_URL: http://${PUBLIC_HOST:-10.2.67.21}:8001
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth
      - reports-api

  # ---- Assignment 2: reports ETL + API ----
  source-db:
    image: postgres:14
    environment:
      POSTGRES_DB: bionicpro
      POSTGRES_USER: bionic
      POSTGRES_PASSWORD: bionic
    ports:
      - "5434:5432"
    volumes:
      - ./source-db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - source-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bionic -d bionicpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/init/01_schema.sql:/schema.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        clickhouse-client --host clickhouse --multiquery < /schema.sql
        echo "ClickHouse schema applied"
    restart: "no"

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    depends_on:
      source-db:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      SOURCE_DB_HOST: source-db
      SOURCE_DB_PORT: "5432"
      SOURCE_DB_NAME: bionicpro
      SOURCE_DB_USER: bionic
      SOURCE_DB_PASSWORD: bionic
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      AIRFLOW_CREDENTIALS: admin:admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8085:8080"
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname Bionic \
          --role Admin --email admin@example.com || true
        ( sleep 30
          airflow dags unpause bionicpro_reports_etl || true
          airflow dags trigger bionicpro_reports_etl || true
        ) &
        airflow scheduler &
        exec airflow webserver --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AUTH_URL: http://bionicpro-auth:8001
      COOKIE_NAME: bionicpro_session
      FRONTEND_URL: http://${PUBLIC_HOST:-10.2.67.21}:3000
      PUBLIC_HOST: ${PUBLIC_HOST:-10.2.67.21}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      bionicpro-auth:
        condition: service_started

volumes:
  source-db-data:
  clickhouse-data:
  airflow-logs:
