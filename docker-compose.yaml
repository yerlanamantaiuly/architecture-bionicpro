services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "BionicPRO Representation"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_READONLY_USER: "false"
      LDAP_TLS: "false"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./ldap/config.ldif:/ldifs/config.ldif:ro
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=example,dc=com", "-D", "cn=admin,dc=example,dc=com", "-w", "admin"]
      interval: 10s
      timeout: 5s
      retries: 10

  ldap-init:
    image: osixia/openldap:1.5.0
    depends_on:
      ldap:
        condition: service_healthy
    volumes:
      - ./ldap/config.ldif:/ldifs/config.ldif:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "Loading BionicPRO LDIF into OpenLDAP..."
        ldapadd -x -H ldap://ldap -D "cn=admin,dc=example,dc=com" -w admin -f /ldifs/config.ldif || true
        echo "LDAP init done"
        ldapsearch -x -H ldap://ldap -b "ou=People,dc=example,dc=com" -D "cn=admin,dc=example,dc=com" -w admin "(uid=*)" uid
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: http://${PUBLIC_HOST:-10.2.67.21}:8080
      KC_HOSTNAME_ADMIN_URL: http://${PUBLIC_HOST:-10.2.67.21}:8080
      KC_PROXY: edge
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - ldap

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://${PUBLIC_HOST:-10.2.67.21}:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-secret
      REDIRECT_URI: http://${PUBLIC_HOST:-10.2.67.21}:8001/auth/callback
      FRONTEND_URL: http://${PUBLIC_HOST:-10.2.67.21}:3000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      SESSION_TTL_SECONDS: "1800"
      TOKEN_ENCRYPTION_KEY: "iw3lx6S7H4IMZsm_xrqEJqa5kHozlwoP9J0WFWHHRoU="
      PROFILE_DB_PATH: /data/profiles.db
      YANDEX_IDP_ALIAS: yandex
      YANDEX_CLIENT_ID: 5e79e67eaecc4daaa87a3b5a5e09c05e
      YANDEX_CLIENT_SECRET: b64e2bf97bdb4bbfa08f474595de7d40
    volumes:
      - ./bionicpro-auth/data:/data
    depends_on:
      - keycloak

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://${PUBLIC_HOST:-10.2.67.21}:8000
        REACT_APP_AUTH_URL: http://${PUBLIC_HOST:-10.2.67.21}:8001
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth
      - reports-api

  # ---- Assignment 2: reports ETL + API ----
  source-db:
    image: postgres:14
    environment:
      POSTGRES_DB: bionicpro
      POSTGRES_USER: bionic
      POSTGRES_PASSWORD: bionic
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
    ports:
      - "5434:5432"
    volumes:
      - ./source-db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - source-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bionic -d bionicpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/init/01_schema.sql:/schema.sql:ro
      - ./clickhouse/init/02_cdc.sql:/cdc.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        clickhouse-client --host clickhouse --multiquery < /schema.sql
        echo "ClickHouse base schema applied"
        # CDC KafkaEngine tables — kafka may be down at first boot; re-applied by cdc-ch-init
        clickhouse-client --host clickhouse --multiquery < /cdc.sql || echo "CDC schema deferred"
    restart: "no"

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    depends_on:
      source-db:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      SOURCE_DB_HOST: source-db
      SOURCE_DB_PORT: "5432"
      SOURCE_DB_NAME: bionicpro
      SOURCE_DB_USER: bionic
      SOURCE_DB_PASSWORD: bionic
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      AIRFLOW_CREDENTIALS: admin:admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8085:8080"
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname Bionic \
          --role Admin --email admin@example.com || true
        ( sleep 30
          airflow dags unpause bionicpro_reports_etl || true
          airflow dags trigger bionicpro_reports_etl || true
        ) &
        airflow scheduler &
        exec airflow webserver --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s

  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AUTH_URL: http://bionicpro-auth:8001
      COOKIE_NAME: bionicpro_session
      FRONTEND_URL: http://${PUBLIC_HOST:-10.2.67.21}:3000
      PUBLIC_HOST: ${PUBLIC_HOST:-10.2.67.21}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: bionicpro-reports
      CDN_PUBLIC_URL: http://${PUBLIC_HOST:-10.2.67.21}:8088
      REPORT_MART: user_report_mart_cdc
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      bionicpro-auth:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      debezium-init:
        condition: service_completed_successfully

  # ---- Assignment 3: S3 (MinIO) + CDN (Nginx cache) ----
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    # Image may lack curl; readiness is enforced by minio-init retries.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2s bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: bionicpro-reports
    volumes:
      - ./minio/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    restart: "no"

  cdn:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8088:80"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q cdn-ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Assignment 4: CDC (Debezium → Kafka → ClickHouse) ----
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: bionicproKafkaCluster01
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  connect:
    image: debezium/connect:2.5
    depends_on:
      kafka:
        condition: service_healthy
      source-db:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect
      CONFIG_STORAGE_TOPIC: bionicpro_connect_configs
      OFFSET_STORAGE_TOPIC: bionicpro_connect_offsets
      STATUS_STORAGE_TOPIC: bionicpro_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  source-db-cdc-prepare:
    image: postgres:14
    depends_on:
      source-db:
        condition: service_healthy
    volumes:
      - ./source-db/cdc-prepare.sql:/cdc-prepare.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        PGPASSWORD=bionic psql -h source-db -U bionic -d bionicpro -f /cdc-prepare.sql
        echo "Postgres CDC prepare done"
    restart: "no"

  cdc-ch-init:
    image: clickhouse/clickhouse-server:24.3
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./clickhouse/init/02_cdc.sql:/cdc.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        clickhouse-client --host clickhouse --multiquery < /cdc.sql
        echo "ClickHouse CDC KafkaEngine/MV applied"
    restart: "no"

  debezium-init:
    image: curlimages/curl:8.5.0
    depends_on:
      connect:
        condition: service_healthy
      source-db-cdc-prepare:
        condition: service_completed_successfully
      cdc-ch-init:
        condition: service_completed_successfully
    volumes:
      - ./debezium/connector-crm.json:/debezium/connector-crm.json:ro
      - ./debezium/register-connector.sh:/debezium/register-connector.sh:ro
    entrypoint: ["/bin/sh", "/debezium/register-connector.sh"]
    restart: "no"

volumes:
  source-db-data:
  clickhouse-data:
  airflow-logs:
  minio-data:
  kafka-data:
