# CDN emulator: Nginx reverse proxy → MinIO + proxy_cache.
# Demo: curl -sI URL | grep X-Cache-Status   →  MISS then HIT

proxy_cache_path /var/cache/nginx/reports
    levels=1:2
    keys_zone=reports_cache:10m
    max_size=512m
    inactive=24h
    use_temp_path=off;

upstream minio_s3 {
    server minio:9000;
}

server {
    listen 80;
    server_name _;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 'cdn-ok\n';
    }

    # /cdn/<object-key> → MinIO /bionicpro-reports/<object-key>
    location /cdn/ {
        proxy_cache reports_cache;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;

        proxy_pass http://minio_s3/bionicpro-reports/;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-CDN-Node "bionicpro-nginx-cdn" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;

        limit_except GET HEAD {
            deny all;
        }
    }
}
